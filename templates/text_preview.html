<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本预览 - {{ file_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 现有样式保持不变 */

        /* 新增下载按钮样式 */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #495057;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            padding: 8px 15px;
            transition: all 0.3s;
            cursor: pointer;
            font-size: 16px;
            gap: 8px;
        }

        .download-btn:hover {
            background-color: #e9ecef;
            text-decoration: none;
            color: #212529;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .content-controls {
                flex-wrap: wrap;
            }

            .download-btn {
                flex: 1 0 auto;
            }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 标记文件为已查阅
            const filePath = "{{ file_path }}";
            if (typeof(Storage) !== "undefined") {
                let viewedFiles = JSON.parse(localStorage.getItem('viewedFiles')) || [];
                if (!viewedFiles.includes(filePath)) {
                    viewedFiles.push(filePath);
                    localStorage.setItem('viewedFiles', JSON.stringify(viewedFiles));
                }
            }
            // 现有JavaScript代码保持不变
        });
    </script>
</head>
<body>
    <div class="container">
        <div class="preview-header">
            <div class="back-btn">
                <a href="{{ url_for('index', dir=parent_dir) }}{{ '?' if not parent_dir else '&' }}token={{ token }}">
                    <i class="fas fa-arrow-left"></i> 返回列表
                </a>
            </div>
            <div class="file-title">
                <h1>文本预览: {{ file_title }}</h1>
            </div>
        </div>

        <div class="file-info">
            <div class="info-item">
                <div class="info-label">文件大小</div>
                <div class="info-value">{{ file_size | format_size }}</div>
            </div>
            <div class="info-item">
                <div class="info-label">文件类型</div>
                <div class="info-value">{{ file_ext | upper }}</div>
            </div>
            <div class="info-item">
                <div class="info-label">当前编码</div>
                <div class="info-value">{{ encoding | upper }}</div>
            </div>
        </div>

        {% if error_message %}
        <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i> {{ error_message }}
        </div>
        {% endif %}

        <div class="encoding-selector">
            <label for="encodingSelect">选择编码:</label>
            <select id="encodingSelect" class="encoding-select">
                <option value="utf-8" {% if encoding == 'utf-8' %}selected{% endif %}>UTF-8</option>
                <option value="gbk" {% if encoding == 'gbk' %}selected{% endif %}>GBK</option>
                <option value="gb18030" {% if encoding == 'gb18030' %}selected{% endif %}>GB18030</option>
                <option value="big5" {% if encoding == 'big5' %}selected{% endif %}>Big5</option>
                <option value="latin1" {% if encoding == 'latin1' %}selected{% endif %}>Latin-1</option>
                <option value="iso-8859-1" {% if encoding == 'iso-8859-1' %}selected{% endif %}>ISO-8859-1</option>
                <option value="cp1252" {% if encoding == 'cp1252' %}selected{% endif %}>Windows-1252</option>
            </select>
            <button id="reloadBtn" class="reload-btn">重新加载</button>
        </div>

        <div class="content-container">
            <div class="content-controls">
                <button id="fontSizeBtn" class="content-btn">
                    <i class="fas fa-text-height"></i> 大字号
                </button>
                <button id="wrapTextBtn" class="content-btn">
                    <i class="fas fa-text-width"></i> 自动换行
                </button>
                <button id="copyBtn" class="content-btn">
                    <i class="fas fa-copy"></i> 复制内容
                </button>

                <!-- 新增下载按钮 -->
                <a href="{{ url_for('serve_file', filename=filename) }}?token={{ token }}" download class="content-btn download-btn">
                    <i class="fas fa-download"></i> 下载文件
                </a>
            </div>

            <div class="content-wrapper">
                <pre id="fileContent" class="file-content wrap-text">{{ content }}</pre>
            </div>
        </div>
    </div>
</body>
</html>
